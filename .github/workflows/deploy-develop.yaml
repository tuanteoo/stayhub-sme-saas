name: Deploy Spring Boot to AWS (Develop)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Thiết lập Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Kiểm tra kết nối mạng
        run: nc -zv -w 5 ${{ secrets.EC2_HOST }} 22

      - name: Đóng gói bằng Maven
        run: mvn clean package -DskipTests

      - name: Đẩy tệp .jar lên AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1

      - name: Thực thi ứng dụng trên AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /home/ubuntu/app
            
            pkill -f 'java -jar' || true
            sleep 10
            
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi
            
            # Sử dụng bash -c bọc câu lệnh và thêm disown ở cuối
            bash -c "nohup java -jar -Dspring.profiles.active=prod *.jar > app.log 2>&1 < /dev/null & disown"