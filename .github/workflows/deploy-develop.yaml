name: Deploy Spring Boot to AWS (Develop)
run: nc -zv ${{ secrets.EC2_HOST }} 22

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Thiết lập môi trường Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Đóng gói ứng dụng bằng Maven
        run: mvn clean package -DskipTests

      - name: Khởi tạo thư mục trên máy chủ AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app

      - name: Đẩy tệp tin lên máy chủ AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1

      - name: Khởi động ứng dụng trên AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /home/ubuntu/app
            
            # Tìm và tắt tiến trình Java cũ đang chạy để giải phóng cổng 8080
            pkill -f 'java -jar' || true
            
            # Xóa tệp tin nhật ký cũ
            rm -f app.log
            
            # Nạp các biến bảo mật từ tệp .env vào hệ thống
            set -a
            source /home/ubuntu/app/.env
            set +a
            
            # Chạy ứng dụng mới ngầm định
            nohup java -jar -Dspring.profiles.active=prod *.jar > app.log 2>&1 &