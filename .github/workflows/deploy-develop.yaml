name: CI/CD Pipeline for StayHub Backend

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Đăng nhập vào hệ thống Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESSTOKEN }}

      - name: Thiết lập cơ chế Buildx để build Docker Image tối ưu
        uses: docker/setup-buildx-action@v3

      - name: Build mã nguồn và Push Image lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stayhub-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Copy tệp cấu hình Docker Compose lên Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: SSH vào Server AWS và cập nhật ứng dụng không gián đoạn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            docker compose pull
            
            if docker ps | grep -q "stayhub-backend-blue"; then
                echo "Triển khai Green..."
                docker compose up -d app_green
                
                echo "Đợi app_green khởi động..."
                for i in {1..24}; do
                    if curl -s http://localhost:8081 > /dev/null; then echo "app_green đã sẵn sàng!"; break; fi
                    sleep 5
                done
                
                echo "Reloading Nginx trên Ubuntu..."
                sudo systemctl reload nginx
                
                docker compose stop app_blue
            else
                echo "Triển khai Blue..."
                docker compose up -d app_blue
                
                echo "Đợi app_blue khởi động..."
                for i in {1..24}; do
                    if curl -s http://localhost:8080 > /dev/null; then echo "app_blue đã sẵn sàng!"; break; fi
                    sleep 5
                done
                
                echo "Reloading Nginx trên Ubuntu..."
                sudo systemctl reload nginx
                
                docker compose stop app_green
            fi