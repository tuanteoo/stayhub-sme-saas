name: CI/CD Pipeline for StayHub Backend

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Đăng nhập vào hệ thống Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESSTOKEN }}

      - name: Thiết lập cơ chế Buildx để build Docker Image tối ưu
        uses: docker/setup-buildx-action@v3

      - name: Build mã nguồn và Push Image lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stayhub-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH vào Server AWS và cập nhật ứng dụng không downtime
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/app
            
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/stayhub-backend:latest
            
            docker compose up -d backend_app