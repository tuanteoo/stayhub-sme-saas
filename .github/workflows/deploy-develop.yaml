name: CI/CD Pipeline for StayHub Backend

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Đăng nhập vào hệ thống Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESSTOKEN }}

      - name: Thiết lập cơ chế Buildx để build Docker Image tối ưu
        uses: docker/setup-buildx-action@v3

      - name: Build mã nguồn và Push Image lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stayhub-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Copy tệp cấu hình Docker Compose lên Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: SSH vào Server AWS và cập nhật ứng dụng
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            
            # Ghi cấu hình môi trường
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            
            # Tải image mới nhất
            docker compose pull
            
            # Tái khởi động dịch vụ app (Docker sẽ tự động tắt container cũ và bật container mới)
            echo "Đang cập nhật ứng dụng stayhub-backend..."
            docker compose up -d --remove-orphans app
            
            echo "Cập nhật thành công!"