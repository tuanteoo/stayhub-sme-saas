name: Deploy Spring Boot to AWS (Develop)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Thiết lập Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Kiểm tra kết nối mạng (Network Check)
        run: nc -zv -w 5 ${{ secrets.EC2_HOST }} 22

      - name: Đóng gói bằng Maven
        run: mvn clean package -DskipTests

      - name: Đẩy tệp .jar lên AWS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1

      - name: Thực thi ứng dụng trên AWS (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Thêm các tham số bảo hiểm
          sync: true
          debug: true
          script: |
            cd /home/ubuntu/app
            # Dừng ứng dụng cũ nếu đang chạy
            pkill -f 'java -jar' || true
            
            # Nạp biến môi trường và chạy ứng dụng
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi
            nohup java -jar -Dspring.profiles.active=prod *.jar > app.log 2>&1 &