version: '3.8'

services:
  app_blue:
    image: ${DOCKER_USERNAME}/stayhub-backend:latest
    container_name: stayhub-backend-blue
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env
    restart: always

  app_green:
    image: ${DOCKER_USERNAME}/stayhub-backend:latest
    container_name: stayhub-backend-green
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_blue
      - app_green
    restart: always